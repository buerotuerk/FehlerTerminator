<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FehlerTerminator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      font-size: 18px;
      margin-top: 10px;
    }

    button {
      background: #3b6fd8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .result {
      background: white;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .hersteller-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .hersteller-buttons button {
      background: #ddd;
      color: black;
    }

    .active {
      background: #3b6fd8 !important;
      color: white !important;
    }

    .small-hint {
      font-size: 13px;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>FehlerTerminator</h1>

<input id="searchInput" placeholder="Fehlercode eingeben (z. B. F.735, f735, f 735 oder 735)">
<button onclick="suche()">Suchen</button>
<div class="small-hint">Enter-Taste funktioniert ebenfalls. Schreibweise ist egal: groß/klein, mit/ohne Punkt, mit/ohne Leerzeichen.</div>

<div class="hersteller-buttons">
  <button onclick="setHersteller('Vaillant', this)">Vaillant</button>
  <button onclick="setHersteller('Stiebel', this)">Stiebel</button>
  <button onclick="setHersteller('Buderus', this)">Buderus</button>
  <button onclick="setHersteller('Viessmann', this)">Viessmann</button>
</div>

<div id="result"></div>

<script>
  // ZENTRALE SAMMLUNG
  let alleCodes = [];

  // HERSTELLER FILTER
  let aktiverHersteller = null;

  function setHersteller(name, button) {
    aktiverHersteller = name;

    document.querySelectorAll(".hersteller-buttons button").forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");
    suche();
  }

  // ROBUSTE NORMALISIERUNG
  // Beispiele:
  // F.735 -> F735
  // f 735 -> F735
  // f-735 -> F735
  // 735 -> 735
  function normalizeCode(code) {
    return String(code || "")
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");
  }

  function codePasst(eintragCode, sucheCode) {
    const code = normalizeCode(eintragCode);
    const gesucht = normalizeCode(sucheCode);

    if (!gesucht) return false;

    // direkte Suche: F735 findet F735
    if (code.includes(gesucht)) return true;

    // Zahlensuche: 735 findet F735
    const codeNurZahlen = code.replace(/[^0-9]/g, "");
    const gesuchtNurZahlen = gesucht.replace(/[^0-9]/g, "");

    if (gesuchtNurZahlen && codeNurZahlen.includes(gesuchtNurZahlen)) return true;

    return false;
  }

  function textPasst(e, suchText) {
    const gesucht = String(suchText || "").trim().toLowerCase();
    if (!gesucht) return false;

    const gesamterText = [
      e.code,
      e.bedeutung,
      e.ursache,
      e.hinweis,
      e.geraet,
      e.hersteller,
      e.gruppe,
      e.baujahr
    ].join(" ").toLowerCase();

    return gesamterText.includes(gesucht);
  }

  function suche() {
    const input = document.getElementById("searchInput").value;
    const resultDiv = document.getElementById("result");

    if (!input.trim()) {
      resultDiv.innerHTML = "<div class='result'>Bitte Fehlercode oder Suchbegriff eingeben.</div>";
      return;
    }

    const treffer = alleCodes.filter(e => {
      const matchCode = codePasst(e.code, input);
      const matchText = textPasst(e, input);

      const matchHersteller = aktiverHersteller
        ? e.hersteller === aktiverHersteller
        : true;

      return (matchCode || matchText) && matchHersteller;
    });

    if (treffer.length === 0) {
      resultDiv.innerHTML = "<div class='result'>Kein Treffer gefunden</div>";
      return;
    }

    resultDiv.innerHTML = treffer.map(e => `
      <div class="result">
        <h2>${e.code || ""}</h2>

        <strong>${e.bedeutung || ""}</strong><br><br>

        ${e.ursache ? `<strong>Ursache:</strong><br>${e.ursache}<br><br>` : ""}

        ${e.hinweis ? `<strong>Hinweis:</strong><br>${e.hinweis}<br><br>` : ""}

        <strong>Gerät:</strong><br>${e.geraet || "-"}<br><br>

        <small>
        Hersteller: ${e.hersteller || "-"}<br>
        Gruppe: ${e.gruppe || "-"}<br>
        Baujahr: ${e.baujahr || "-"}
        </small>
      </div>
    `).join("");
  }

  // Enter-Taste startet Suche
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("searchInput");
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        suche();
      }
    });
  });
</script>

</body>
</html>
